<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Block — Post-run</title>
<meta name="description" content="A training block, seen whole: every prescribed day drawn as load and power.">
<style>
/* ── tokens ────────────────────────────────────────────────────────────
   The palette is the sport's own: effort runs cool to hot, and only the
   top two zones are allowed to be warm, so a hard day is visible from
   across the room and an easy week stays quiet. */
:root{
  --paper:#E7EBF1; --card:#F6F8FB; --rule:#CBD4E0;
  --ink:#0F1720; --ink-2:#5A6674; --ink-3:#616A75;
  /* ink-3 carries captions, week labels, the axis and the eyebrows -- all small
     text, so it is set at 4.59:1 on paper rather than at the grey that looked
     right and measured 2.58 */
  --z1:#93A6BA; --z2:#5C86AC; --z3:#D9A03F; --z4:#DC672C; --z5:#BE3624;
  --sel:#0F1720;
  --display:"Antonio",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@font-face{font-family:Antonio;src:url(fonts/antonio-600.woff2)format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-400.woff2)format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-600.woff2)format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-400.woff2)format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-500.woff2)format('woff2');font-weight:500;font-display:swap}

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}
body{padding:28px clamp(16px,4vw,56px) 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── masthead ─────────────────────────────────────────────────────── */
.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px}
.mark{font-family:var(--display);font-size:clamp(30px,4vw,46px);line-height:.9;
  letter-spacing:.01em;text-transform:uppercase;margin:0}
.top .meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);
  letter-spacing:.02em;margin-left:auto;text-align:right;line-height:1.5}

/* ── the block: the one thing this page exists to show ───────────────
   Height is the day's load, the fill is how that load was made. Six
   weeks of shape in a single glance -- long runs wide and low, tests
   spiking over CP, rest days as a gap in the rhythm. */
.blockwrap{margin:26px 0 0}
.blockhead{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.blockhead h2{font-family:var(--display);font-size:19px;letter-spacing:.06em;
  text-transform:uppercase;margin:0;font-weight:600}
.blockhead p{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0}
.block{display:flex;align-items:flex-end;gap:2px;height:190px;
  border-bottom:1px solid var(--ink);padding-bottom:0}
.day{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;
  justify-content:flex-end;height:100%;background:none;border:0;padding:0 0 0 0;
  cursor:pointer;font:inherit}
.day .stack{display:flex;flex-direction:column-reverse;width:100%;overflow:hidden}
.day .stack i{display:block}
.day.rest .stack{border-bottom:2px dotted var(--ink-3);height:3px}
.day:hover .stack{filter:brightness(1.06)}
.day.on::after{content:"";position:absolute;inset:-4px -3px -1px;border:1.5px solid var(--sel);
  border-bottom-width:3px;pointer-events:none}
.weeks{display:flex;gap:2px;margin-top:7px}
.wk{flex:1 1 0;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  text-align:center;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.wk.mon{color:var(--ink-2)}

/* the load axis, because a shape without a scale is decoration */
.block{position:relative}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--rule);pointer-events:none}
.gridline span{position:absolute;right:0;top:-8px;font-family:var(--mono);
  font-size:9.5px;color:var(--ink-3);background:var(--paper);padding-left:6px}

/* ── the day ─────────────────────────────────────────────────────── */
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:26px;margin-top:34px;align-items:start}
.panel{background:var(--card);border:1px solid var(--rule);padding:22px 24px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.title{font-family:var(--display);font-size:clamp(26px,3vw,38px);line-height:1;
  text-transform:uppercase;margin:0 0 14px;letter-spacing:.01em}
.figs{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 20px;padding:0;list-style:none}
.figs div{font-family:var(--mono)}
.figs b{display:block;font-size:22px;font-weight:500;letter-spacing:-.01em}
.figs span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.chart{position:relative;height:150px;border-bottom:1px solid var(--ink);
  display:flex;align-items:flex-end;gap:2px}
/* an element with display:flex ignores the hidden attribute unless told */
.chart[hidden],.axis[hidden],.legend[hidden]{display:none}
.chart i{display:block;min-width:2px}
.cp{position:absolute;left:0;right:0;border-top:1px dashed var(--ink);opacity:.6}
.cp b{position:absolute;right:0;top:-16px;font-family:var(--mono);font-size:10px;
  font-weight:500;letter-spacing:.1em;background:var(--card);padding-left:6px}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10px;color:var(--ink-3);margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;display:block}

.pre{font-family:var(--mono);font-size:12.5px;line-height:1.72;color:var(--ink-2);
  white-space:pre-wrap;overflow-wrap:break-word;margin:0;
  max-height:430px;overflow:auto}

/* ── the sessions around the run ─────────────────────────────────── */
.around{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.sess{background:var(--card);border:1px solid var(--rule);padding:18px 20px}
.sess h3{font-family:var(--display);font-size:17px;text-transform:uppercase;
  letter-spacing:.03em;margin:0 0 3px;font-weight:600}
.sess .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.sess ol{margin:0;padding:0;list-style:none;
  font-size:13.5px;line-height:1.5}
.sess li{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--rule)}
.sess li:first-child{border-top:0}
.sess li a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.sess li a:hover{border-bottom-color:var(--ink)}
.sess .dose{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  white-space:nowrap}
.sess .none{font-size:13px;color:var(--ink-3)}

.foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  display:flex;gap:18px;flex-wrap:wrap}

/* one orchestrated moment: the block builds itself once, on arrival */
@media (prefers-reduced-motion:no-preference){
  .day .stack{transform-origin:bottom;animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards}
}
@keyframes rise{from{transform:scaleY(.04);opacity:0}to{transform:scaleY(1);opacity:1}}

@media (max-width:900px){
  .detail{grid-template-columns:1fr}
  .block{height:150px}
  .top .meta{margin-left:0;text-align:left;width:100%}
}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="mark">The Block</h1>
    <div class="meta" id="meta">Loading the plan…</div>
  </header>

  <section class="blockwrap">
    <div class="blockhead">
      <h2>Load, day by day</h2>
      <p>Height is the day's stress score. The bands are where that load was spent.</p>
    </div>
    <div class="block" id="block"></div>
    <div class="weeks" id="weeks"></div>
  </section>

  <section class="detail">
    <div class="panel">
      <p class="eyebrow" id="dayDate">—</p>
      <h2 class="title" id="dayTitle">Pick a day</h2>
      <div class="figs" id="dayFigs"></div>
      <div class="chart" id="chart"></div>
      <div class="axis" id="axis"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <p class="eyebrow">The prescription</p>
      <pre class="pre" id="pre">—</pre>
    </div>
  </section>

  <section class="around" id="around"></section>

  <footer class="foot" id="foot"></footer>
</div>

<script>
var D = "(?:(\\d+):(\\d{2})|(\\d+)\\s*(?:minutes?|min\\b)|(\\d+)\\s*(?:seconds?|secs?|s)\\b)";
var RX = {
  reps:  new RegExp("(\\d+)\\s*x\\s*" + D + "\\s*(?:\\(or[^)]*\\))?\\s*(?:@|at)?\\s*(?:(\\d+)\\s*-\\s*(\\d+)\\s*%|[^\\n]*?(near top speed|maximal|all out))", "i"),
  rec:   new RegExp("\\(\\s*" + D + "[^)]*?(?:rec|easy|jog|walk|between)", "i"),
  recAt: new RegExp("^\\(\\s*" + D + "[^)]*?(?:rec|easy|jog|walk|between)", "i"),
  forD:  new RegExp("(?:for|first)\\s+(?:the\\s+first\\s+)?" + D, "i"),
  maxEff:new RegExp("run\\s+" + D + "\\s+at\\s+maxim", "i"),
  walk:  new RegExp("(?:stop|walk)[^\\n]*?(?:for|next)\\s+" + D, "i"),
  tempo: new RegExp("\\b" + D + "\\s+(?:MP\\s+)?tempo\\s*(?:@|at)\\s*(\\d+)\\s*-\\s*(\\d+)\\s*%", "i"),
  warm:  new RegExp("warm[\\s-]?up\\s+for\\s+" + D, "i"),
  more:  /(?:additional|more)\s+(?:(\d+)\s*)?minutes?/i,
  fill:  /remainder|balance of|complete the run|cool ?down|resume ez/i,
  stop:  /^\s*(the purpose|do not overpower|avoid |the objective|the addition|_{3,})/i,
  base:  /^\s*(?:ez|easy)\s+run\b|^\s*(?:ez|easy)\s+running\b/i,
  soft:  /easy|ez|steady/i
};

function durAt(m, i){
  if (!m) return 0;
  if (m[i] != null) return parseInt(m[i], 10) * 60 + parseInt(m[i+1], 10);
  if (m[i+2] != null) return parseInt(m[i+2], 10) * 60;
  if (m[i+3] != null) return parseInt(m[i+3], 10);
  return 0;
}

function lineSegments(line, next){
  var m = RX.reps.exec(line), out = [], i;
  if (m){
    var n = parseInt(m[1], 10), d = durAt(m, 2), lo, hi;
    if (m[6]){ lo = parseInt(m[6], 10); hi = parseInt(m[7], 10); }
    else { lo = /top speed/i.test(m[8] || "") ? 120 : 100; hi = 200; }
    /* the recoveries are often on the next line, in brackets, alone */
    var r = RX.rec.exec(line.slice(m.index + m[0].length - 1)) || RX.recAt.exec((next || "").trim()),
        rec = durAt(r, 1);
    for (i = 0; i < n; i++){
      out.push({ s:d, lo:lo, hi:hi, k:"work" });
      if (rec) out.push({ s:rec, lo:0, hi:50, k:"rec" });
    }
    return out;
  }
  m = RX.maxEff.exec(line);
  if (m) return [{ s:durAt(m, 1), lo:100, hi:200, k:"max" }];
  m = RX.walk.exec(line);
  if (m) return [{ s:durAt(m, 1), lo:0, hi:50, k:"rec" }];
  m = RX.tempo.exec(line);
  if (m) return [{ s:durAt(m, 1), lo:parseInt(m[5], 10), hi:parseInt(m[6], 10), k:"work" }];
  if (RX.soft.test(line)){
    m = RX.forD.exec(line);
    if (m) return [{ s:durAt(m, 1), lo:0, hi:80, k:"easy" }];
    m = RX.more.exec(line);
    if (m) return [{ s:(parseInt(m[1], 10) || 1) * 60, lo:0, hi:80, k:"easy" }];
  }
  return out;
}

function sessionSegments(desc, total){
  var lines = (desc || "").split("\n").slice(1),   /* line 1 summarises the set */
      segs = [], i = 0, j, block, got, stated, m;

  while (i < lines.length){
    var line = lines[i];
    if (RX.stop.test(line)) break;
    if (!line.trim()){ i++; continue }

    m = RX.warm.exec(line);
    if (m){
      stated = durAt(m, 1);
      block = []; j = i + 1;
      while (j < lines.length && lines[j].trim() && !RX.stop.test(lines[j])){
        block = block.concat(lineSegments(lines[j], lines[j+1] || "")); j++;
      }
      got = block.reduce(function(a, x){ return a + x.s }, 0);
      /* Prefer the detail: Stryd's bullets often fall short of the heading they
         sit under, and a flat twenty-minute bar hides the surges inside it. The
         shortfall lands in the cool-down, which is the remainder anyway. Only a
         block that overruns its heading is a real contradiction. */
      segs = segs.concat(block.length && got <= stated + 90
        ? block : [{ s:stated, lo:0, hi:80, k:"easy" }]);
      i = j; continue;
    }
    if (RX.fill.test(line)){ segs.push({ fill:true }); i++; continue }
    if (RX.base.test(line) && !RX.forD.test(line)){ segs.push({ fill:true }); i++; continue }

    segs = segs.concat(lineSegments(line, lines[i+1] || ""));
    i++;
  }

  var explicit = 0, holes = [];
  segs.forEach(function(x){ if (x.fill) holes.push(x); else explicit += x.s });
  if (holes.length){
    var rest = total - explicit;
    if (rest < 0) return [];
    var each = Math.floor(rest / holes.length);
    holes.forEach(function(h){ h.s = each; h.lo = 0; h.hi = 80; h.k = "easy"; delete h.fill });
    holes[holes.length - 1].s += rest - each * holes.length;
  }
  var sum = segs.reduce(function(a, x){ return a + x.s }, 0);
  if (!segs.length || Math.abs(sum - total) > 90) return [];
  return segs;
}
/* ── the block ───────────────────────────────────────────────────────
   Everything below reads the same plan.json the phone app reads. No
   second source, no second sync. */

var ZONE = ["--z1","--z2","--z3","--z4","--z5"];
var DOC = null, DAYS = [], SEL = null;

function zoneOf(hi){
  return hi <= 80 ? 0 : hi <= 92 ? 1 : hi <= 100 ? 2 : hi <= 110 ? 3 : 4;
}
function colourOf(hi){
  return getComputedStyle(document.documentElement).getPropertyValue(ZONE[zoneOf(hi)]).trim();
}
function clock(sec){
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function mins(sec){
  var m = Math.round(sec / 60);
  return m >= 60 ? Math.floor(m / 60) + "h " + (m % 60 ? (m % 60) + "m" : "") : m + " min";
}
function esc(t){
  return String(t == null ? "" : t).replace(/[&<>]/g, function(c){
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
  });
}

/* A day's shape: the parsed segments where the prose reconciles with the
   planned duration, and a single flat bar where it does not. One of the
   thirteen prescriptions in this block cannot be reconciled, and drawing
   a guess for it would be worse than drawing its load honestly. */
function shapeOf(run){
  if (!run) return [];
  var segs = sessionSegments(run.desc, run.duration_s);
  if (segs.length) return segs;
  return [{ s: run.duration_s, lo: 0, hi: 80, k: "flat" }];
}

/* Time in each zone, as a share of the session. Easy sits at the foot of the
   bar and max at the top, so the hard work is always the part on the skyline. */
function bandsOf(run){
  if (!run) return [];
  var segs = sessionSegments(run.desc, run.duration_s), total = 0, by = [0,0,0,0,0];
  if (!segs.length) segs = [{ s: run.duration_s, hi: 80 }];
  segs.forEach(function(g){ by[zoneOf(g.hi)] += g.s; total += g.s });
  if (!total) return [];
  return by.map(function(secs, z){
    return { share: secs / total, colour: colourOf([80,92,100,110,200][z]) };
  });
}

function buildBlock(){
  var host = document.getElementById("block"), weeks = document.getElementById("weeks");
  host.innerHTML = ""; weeks.innerHTML = "";
  var peak = 0;
  DAYS.forEach(function(d){ peak = Math.max(peak, d.rss) });
  peak = Math.max(peak, 10);

  /* a scale, so the shape means something */
  [0.5, 1].forEach(function(f){
    var g = document.createElement("div");
    g.className = "gridline";
    g.style.bottom = (f * 100) + "%";
    g.innerHTML = '<span>' + Math.round(peak * f) + ' RSS</span>';
    host.appendChild(g);
  });

  DAYS.forEach(function(d, i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "day" + (d.run ? "" : " rest");
    b.setAttribute("aria-label", d.iso + (d.run ? " — " + d.run.title : " — rest day"));
    var stack = document.createElement("div");
    stack.className = "stack";
    stack.style.height = d.run ? Math.max(3, d.rss / peak * 100) + "%" : "";
    stack.style.animationDelay = (i * 14) + "ms";

    if (d.run){
      /* Bands, not the profile. Thirty pixels of day cannot hold ten segments
         without turning into a comb -- at this size the readable question is
         how much of the load was easy and how much was not, so each bar stacks
         time by zone. The profile itself gets the detail chart, where it has
         room to be a shape. */
      d.bands.forEach(function(band){
        if (!band.share) return;
        var seg = document.createElement("i");
        seg.style.height = (band.share * 100).toFixed(2) + "%";
        seg.style.width = "100%";
        seg.style.flex = "none";
        seg.style.background = band.colour;
        stack.appendChild(seg);
      });
    }
    b.appendChild(stack);
    b.onclick = function(){ select(i) };
    host.appendChild(b);

    var w = document.createElement("div");
    var dt = new Date(d.iso + "T12:00:00");
    w.className = "wk" + (dt.getDay() === 1 ? " mon" : "");
    /* Mondays carry the date; the rest carry an initial, so the rhythm of
       the week is readable without a row of numbers competing with the bars */
    w.textContent = dt.getDay() === 1
      ? String(dt.getDate())
      : dt.toLocaleDateString(undefined, { weekday:"narrow" });
    weeks.appendChild(w);
  });
}

function select(i){
  if (i < 0 || i >= DAYS.length) return;
  SEL = i;
  [].forEach.call(document.querySelectorAll(".day"), function(el, n){
    el.classList.toggle("on", n === i);
  });
  var d = DAYS[i], run = d.run;

  document.getElementById("dayDate").textContent =
    new Date(d.iso + "T12:00:00").toLocaleDateString(undefined,
      { weekday:"long", day:"numeric", month:"long" });
  document.getElementById("dayTitle").textContent = run ? run.title : "Rest day";

  var figs = document.getElementById("dayFigs");
  figs.innerHTML = run
    ? '<div><b>' + mins(run.duration_s) + '</b><span>Duration</span></div>' +
      (run.distance_m ? '<div><b>' + (run.distance_m/1000).toFixed(1) + ' km</b><span>Distance</span></div>' : '') +
      '<div><b>' + Math.round(run.rss) + '</b><span>Stress score</span></div>' +
      '<div><b>' + d.shape.length + '</b><span>Segments</span></div>'
    : '<div><b>' + (d.sessions.length || "—") + '</b><span>' +
      (d.sessions.length ? "Sessions off the run" : "Nothing at all") + '</span></div>';

  ["chart","axis","legend"].forEach(function(id){
    document.getElementById(id).hidden = !d.run;
  });
  drawChart(d);
  document.getElementById("pre").textContent =
    run ? run.desc : "No run today. The supplemental work below still stands.";
  drawSessions(d);
}

function drawChart(d){
  var chart = document.getElementById("chart"), axis = document.getElementById("axis"),
      legend = document.getElementById("legend");
  chart.innerHTML = ""; axis.innerHTML = ""; legend.innerHTML = "";
  if (!d.run) return;

  var top = 110, used = {};
  d.shape.forEach(function(g){ top = Math.max(top, g.hi) });
  d.shape.forEach(function(g){
    var i = document.createElement("i");
    i.style.flexGrow = g.s;
    i.style.height = (g.hi / top * 100).toFixed(1) + "%";
    i.style.background = colourOf(g.hi);
    i.title = clock(g.s) + " · " + (g.k === "max" ? "all out" : g.lo + "–" + g.hi + "% CP");
    chart.appendChild(i);
    used[zoneOf(g.hi)] = true;
  });

  var cp = document.createElement("div");
  cp.className = "cp";
  cp.style.bottom = (100 / top * 100).toFixed(1) + "%";
  cp.innerHTML = "<b>CP</b>";
  chart.appendChild(cp);

  axis.innerHTML = "<span>0</span><span>" + mins(d.run.duration_s) + "</span>";
  var names = ["Easy", "Steady", "Tempo", "Threshold", "Max"];
  Object.keys(used).sort().forEach(function(z){
    var v = getComputedStyle(document.documentElement).getPropertyValue(ZONE[z]).trim();
    legend.innerHTML += '<span><i style="background:' + v + '"></i>' + names[z] + '</span>';
  });
}

function drawSessions(d){
  var host = document.getElementById("around");
  host.innerHTML = "";
  if (!d.sessions.length){
    host.innerHTML = '<div class="sess"><h3>Nothing else</h3>' +
      '<p class="when">Around the run</p>' +
      '<p class="none">No supplemental session is scheduled for this day. ' +
      'The plan puts them on their own days, not on the running ones.</p></div>';
    return;
  }
  d.sessions.forEach(function(s){
    var el = document.createElement("div");
    el.className = "sess";
    var items = s.exercises.map(function(x){
      return '<li><a href="https://www.youtube.com/watch?v=' + esc(x.id) +
             '" target="_blank" rel="noopener">' + esc(x.label) + '</a>' +
             (x.dose ? '<span class="dose">' + esc(x.dose) + '</span>' : '') + '</li>';
    }).join("");
    el.innerHTML = '<h3>' + esc(s.title) + '</h3>' +
      '<p class="when">' + esc(s.when === "pre" ? "Before the run" : "After the run") +
      ' · ' + esc(s.kind || "session") + '</p>' +
      (items ? '<ol>' + items + '</ol>'
             : '<p class="none">Described in words only — no demonstrations linked.</p>');
    host.appendChild(el);
  });
}

/* ── arrival ─────────────────────────────────────────────────────── */
fetch("../plan.json", { cache:"no-cache" }).then(function(r){
  if (!r.ok) throw new Error("no plan.json");
  var type = r.headers.get("content-type") || "";
  if (type.indexOf("json") < 0) throw new Error("not json");
  return r.json();
}).then(function(doc){
  DOC = doc;
  DAYS = Object.keys(doc.days).sort().map(function(iso){
    var day = doc.days[iso], run = day.run;
    return {
      iso: iso, run: run, rss: run ? (run.rss || 0) : 0,
      shape: shapeOf(run),
      bands: bandsOf(run),
      sessions: (day.sessions || []).map(function(k){ return doc.sessions[k] }).filter(Boolean)
    };
  });

  var runs = DAYS.filter(function(d){ return d.run });
  document.getElementById("meta").innerHTML =
    DAYS.length + " days · " + runs.length + " runs · " +
    Math.round(runs.reduce(function(a, d){ return a + d.run.duration_s }, 0) / 3600) + " hours<br>" +
    DAYS[0].iso + " → " + DAYS[DAYS.length - 1].iso;

  buildBlock();

  /* open on today when the block contains it, and on the first day otherwise */
  var today = new Date(), p = function(v){ return (v < 10 ? "0" : "") + v };
  var iso = today.getFullYear() + "-" + p(today.getMonth()+1) + "-" + p(today.getDate());
  var i = DAYS.findIndex(function(d){ return d.iso === iso });
  select(i >= 0 ? i : 0);

  document.getElementById("foot").innerHTML =
    "Plan synced " + esc(doc.fetched_at) + " · source " + esc(doc.source) +
    " · <span>← → to move between days</span>";
}).catch(function(err){
  document.getElementById("meta").textContent = "No plan.json alongside this page.";
  document.getElementById("dayTitle").textContent = "Nothing to show";
  document.getElementById("pre").textContent =
    "This page reads the plan the sync writes. Run ./token to place a Stryd " +
    "token and the sync will put plan.json in place.";
});

document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey || SEL === null) return;
  if (e.key === "ArrowRight"){ select(Math.min(SEL + 1, DAYS.length - 1)); e.preventDefault() }
  else if (e.key === "ArrowLeft"){ select(Math.max(SEL - 1, 0)); e.preventDefault() }
});
</script>
