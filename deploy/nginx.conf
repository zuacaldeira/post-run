# The whole app is ~150 KB and none of its filenames are content-hashed, so
# freshness cannot come from a max-age guess -- it has to come from revalidation.
# Everything is served no-cache: the browser keeps its copy but always asks, and
# an unchanged file costs a 304. The service worker owns the offline story, so
# this layer only has to avoid getting in its way.
#
# Every add_header lives at server level on purpose. nginx replaces the whole
# inherited set the moment a location adds one of its own, so a single stray
# add_header in a location block would silently drop the CSP for that path.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # not in nginx's default mime.types on every build, and a manifest served as
    # text/plain is ignored by the browser
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/html text/css application/javascript application/json
                      application/manifest+json image/svg+xml;
    # mp4 and png are already compressed; gzipping them burns CPU for nothing

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # 'unsafe-inline' is load-bearing: the CSS, the app and its bundled chroma.js
    # are all inline in index.html. It is a real weakening, and it buys little to
    # pretend otherwise -- but the page takes no user input and loads no
    # third-party script, so there is nothing here for an injection to ride.
    # Swap to sha256- hashes if index.html ever stops being hand-edited.
    # worker-src is spelled out rather than left to fall through to default-src:
    # get it wrong and the service worker silently fails to register.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self'; manifest-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # No Permissions-Policy. The session timer holds the screen awake through the
    # Wake Lock API, whose default allowlist is already 'self'; a hand-written
    # policy that forgets screen-wake-lock would kill the screen mid-routine.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # a stale bookmark or a deep link should still boot the app, which is what the
    # worker does offline too
    location / {
        try_files $uri $uri/ /index.html;
    }
}
