# postrun.zuacaldeira.com — the whole deployment.
#
# The app is eight static files and has no build step, so there is nothing to
# containerise: nginx serves them off disk directly. `./deploy.sh` rsyncs the
# working copy to the root below. Headers that used to live in a container's
# own nginx.conf live here now -- one nginx, one place to look.

server {
    listen 80;
    listen [::]:80;
    server_name postrun.zuacaldeira.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://postrun.zuacaldeira.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name postrun.zuacaldeira.com;

    ssl_certificate     /etc/letsencrypt/live/postrun.zuacaldeira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postrun.zuacaldeira.com/privkey.pem;

    root /var/www/postrun.zuacaldeira.com;
    index index.html;

    # not in nginx's mime.types, and a manifest served as text/plain is ignored
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/html text/css application/javascript application/json
                    application/manifest+json image/svg+xml;
    # mp4 and png are already compressed; gzipping them burns CPU for nothing

    # Every add_header sits at server level on purpose. nginx replaces the whole
    # inherited set the moment a location adds one of its own, so a single stray
    # add_header in a location block would silently drop the CSP for that path.
    #
    # The app is ~150 KB and none of its filenames are content-hashed, so
    # freshness cannot come from a max-age guess -- it has to come from
    # revalidation. no-cache keeps the browser's copy but always asks; an
    # unchanged file costs a 304. The service worker owns the offline story and
    # refreshes itself through this same cache, so a long max-age here would
    # throttle how fast a deploy reaches an installed app.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # An installed PWA must never fall back to plain HTTP: the worker needs a
    # secure origin, and a downgrade silently costs the app its offline mode.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 'unsafe-inline' is load-bearing: the CSS, the app and its bundled chroma.js
    # are all inline in index.html. It is a real weakening, and it buys little to
    # pretend otherwise -- but the page takes no user input and loads no
    # third-party script, so there is nothing here for an injection to ride.
    # Swap to sha256- hashes if index.html ever stops being hand-edited.
    # worker-src is spelled out rather than left to fall through to default-src:
    # get it wrong and the service worker silently fails to register.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self'; manifest-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # No Permissions-Policy. The session timer holds the screen awake through the
    # Wake Lock API, whose default allowlist is already 'self'; a hand-written
    # policy that forgets screen-wake-lock would kill the screen mid-routine.

    # a stale bookmark or a deep link should still boot the app, which is what
    # the worker does offline too
    location / {
        try_files $uri $uri/ /index.html;
    }
}
