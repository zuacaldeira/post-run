# postrun.zuacaldeira.com — the host nginx vhost, for a server that already
# terminates TLS for other sites. This is the deployed configuration; Caddy in
# compose.tls.yaml is the alternative for a box with nothing on 80/443 yet.
#
# Install as /etc/nginx/sites-available/postrun.zuacaldeira.com and symlink it
# into sites-enabled. The container listens on 127.0.0.1:8081 (compose.yaml).

server {
    listen 80;
    listen [::]:80;
    server_name postrun.zuacaldeira.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://postrun.zuacaldeira.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name postrun.zuacaldeira.com;

    ssl_certificate     /etc/letsencrypt/live/postrun.zuacaldeira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postrun.zuacaldeira.com/privkey.pem;

    # An installed PWA must never fall back to plain HTTP: the worker needs a
    # secure origin, and a downgrade silently costs the app its offline mode.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Nothing else is set here on purpose. The cache headers, the CSP and the
    # MIME types come from the app's own nginx inside the container and pass
    # straight through; restating any of them here is how two copies of one
    # header drift apart. If Cache-Control or the CSP ever stop arriving in the
    # browser, look at the container, not at this file.

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # bg.mp4 is served with range requests; buffering it just adds latency
        proxy_buffering off;
    }
}
