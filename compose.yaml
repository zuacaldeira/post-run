# The container speaks plain HTTP on purpose: TLS terminates at whatever proxy you
# already run in front of it. That front end is not optional. Service workers only
# register on a secure origin, so over plain HTTP or a bare LAN IP this app has no
# offline mode, no caching and no self-updating -- it silently degrades to a normal
# web page. Give it a real hostname and a certificate.
services:
  post-run:
    # IMAGE_TAG floats so the server can sit on :latest (default branch only) or
    # pin a branch/sha tag while something is being tried out. See .env.example.
    image: ghcr.io/zuacaldeira/post-run:${IMAGE_TAG:-latest}
    container_name: post-run
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"     # bound to loopback: reachable by the proxy, not the internet
    read_only: true             # nothing writes to disk; nginx only needs its scratch dirs
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks: [web]

networks:
  web:
